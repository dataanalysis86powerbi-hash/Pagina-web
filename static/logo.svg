<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Definición de Gradientes -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7ee787;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Isotipo: Hexágono de Datos -->
  <path d="M40 10 L65 25 L65 55 L40 70 L15 55 L15 25 Z" fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
  
  <!-- Gráfica de Barras interna (Excel Style) -->
  <rect x="25" y="45" width="6" height="15" fill="#58a6ff" opacity="0.8" />
  <rect x="34" y="35" width="6" height="25" fill="#58a6ff" />
  <rect x="43" y="40" width="6" height="20" fill="#7ee787" />
  
  <!-- Línea de Tendencia (Python/Analítica) -->
  <path d="M22 55 Q35 25 58 45" stroke="#7ee787" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Texto: Yonathan Sosa -->
  <text x="85" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#ffffff">
    YONATHAN <tspan fill="url(#logoGrad)">SOSA</tspan>
  </text>
  
  <!-- Subtexto: Excel & Python Expert -->
  <text x="85" y="65" font-family="Arial, sans-serif" font-size="12" fill="#8b949e" letter-spacing="2">
    EXCEL &amp; PYTHON EXPERT
  </text>
</svg>
